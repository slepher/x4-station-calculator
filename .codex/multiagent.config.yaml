version: 1
name: x4-station-calculator-multiagent
description: Multi-agent routing for implementation-owned Unit tests and the E2E-only x4-e2e-test workflow.

defaults:
  language: follow_user
  planning_write_scope: "openspec/**"
  implement_write_scope: "src/**,tests/unit/**,openspec/**"
  e2e_write_scope: "tests/e2e/**,openspec/**"
  canonical_product_tests:
    unit: "tests/unit/**"
    e2e: "tests/e2e/**"
  legacy_tests: "tests/legacy/**"

routing:
  "/x4:discuss":
    pipeline: [workflow_orchestrator, discuss_analyst]
  "/x4:doc":
    pipeline: [workflow_orchestrator, doc_editor]
  "/x4:new":
    pipeline: [workflow_orchestrator, change_creator]
  "/x4:ff":
    pipeline: [workflow_orchestrator, fast_forward_creator]
  "/x4:apply":
    pipeline: [workflow_orchestrator, implementer]
  "/x4:bug":
    pipeline: [workflow_orchestrator, bug_tracker]
  "/x4:bug-fix":
    pipeline: [workflow_orchestrator, bug_fixer]
  "/x4:e2e-test-doc":
    pipeline: [workflow_orchestrator, e2e_test_engineer]
  "/x4:e2e-test-doc-details":
    pipeline: [workflow_orchestrator, e2e_test_engineer]
  "/x4:e2e-test-doc-viewer":
    pipeline: [workflow_orchestrator, e2e_test_engineer]
  "/x4:e2e-test-impl":
    pipeline: [workflow_orchestrator, e2e_test_engineer]
  "/x4:e2e-test":
    pipeline: [workflow_orchestrator, e2e_test_engineer]
  "/x4:e2e-test-run":
    pipeline: [workflow_orchestrator, e2e_test_engineer]
  "/x4:verify":
    pipeline: [workflow_orchestrator, verifier]
  "/x4:archive":
    pipeline: [workflow_orchestrator, archiver]
  default:
    pipeline: [workflow_orchestrator, implementer]

agents:
  workflow_orchestrator:
    role: "Phase router and guardrail enforcer"
    use_skills: [x4-user-workflow]
    responsibilities:
      - "Route only commands listed by x4-user-workflow."
      - "Do not route to retained x4-test, x4-test-doc, x4-test-doc-viewer, x4-test-impl, or x4-test-run skills."
      - "Enforce canonical product-test and owned-path gates."
      - "Follow the user's language; preserve required English spec headers."

  discuss_analyst:
    role: "Discussion and requirement clarification"
    use_skills: [x4-discuss, x4-drag]
    constraints:
      - "No source or test edits."
      - "No document edits unless requested."

  doc_editor:
    role: "OpenSpec planning editor"
    use_skills: [x4-doc, openspec-sync-specs, x4-drag]
    outputs:
      - "request/spec/design/tasks artifacts"
      - "Focused Unit coverage attached to behavior-changing tasks"
    constraints:
      - "Do not edit src/** or tests/**."
      - "Do not put E2E tasks in tasks.md."

  change_creator:
    role: "Step-by-step artifact creator"
    use_skills: [x4-new, x4-doc, x4-drag]

  fast_forward_creator:
    role: "One-pass artifact creator"
    use_skills: [x4-ff, x4-doc, x4-drag]

  implementer:
    role: "Source and focused Unit-test owner"
    use_skills: [x4-apply, x4-drag]
    required_inputs:
      - "openspec/changes/<change>/tasks.md"
      - "openspec/changes/<change>/design.md"
      - "openspec/changes/<change>/specs/**/spec.md"
    required_outputs:
      - "Source changes"
      - "Focused tests/unit/** changes for behavior-changing work"
      - "Focused Unit run evidence"
      - "tasks.md checkbox updates"
    constraints:
      - "Do not author or run E2E tests."

  bug_tracker:
    role: "Report-only bug artifact owner"
    use_skills: [x4-bug]

  bug_fixer:
    role: "Bug reproduction and fix router"
    use_skills: [x4-bug-fix, x4-apply, x4-e2e-test, x4-drag]

  e2e_test_engineer:
    role: "E2E documentation, review, implementation, and run owner"
    use_skills:
      - x4-e2e-test
      - x4-e2e-test-doc
      - x4-e2e-test-doc-details
      - x4-e2e-test-doc-viewer
      - x4-e2e-test-impl
      - x4-e2e-test-run
      - x4-drag
    required_outputs:
      - "openspec/changes/<change>/e2e_tests.md"
      - "openspec/changes/<change>/e2e_test_tasks.md"
      - "tests/e2e/<change>/**"
    constraints:
      - "Do not own Unit tests."
      - "Do not use legacy test_tasks.md or x4-test-* routes."

  verifier:
    role: "Static, canonical Unit, and active E2E verifier"
    use_skills: [x4-verify, openspec-verify-change, x4-e2e-test]

  archiver:
    role: "Archive verified changes"
    use_skills: [x4-archive]

handoff_contracts:
  - from: doc_editor
    to: implementer
    requires:
      - "Behavior-changing tasks include focused Unit coverage"
  - from: implementer
    to: verifier
    requires:
      - "Implementation tasks and focused Unit evidence are complete"
  - from: verifier
    to: archiver
    requires:
      - "verify_status=pass"
      - "unit_status=pass"
      - "e2e_status=pass"
      - "No unresolved blockers"

quality_gates:
  - name: planning_zero_code
    when: ["/x4:discuss", "/x4:doc", "/x4:new", "/x4:ff"]
    rule: "Reject src/** or tests/** edits during planning."
  - name: canonical_product_test_paths
    rule: "Reject new or modified product tests outside tests/unit/** and tests/e2e/**; tests/legacy/** is preservation-only."
  - name: implementation_owns_unit
    when: ["/x4:apply", "/x4:bug-fix"]
    rule: "Reject a behavior-changing source task without focused tests/unit/** evidence, unless the task contract explicitly proves it is test-neutral."
  - name: e2e_route_integrity
    rule: "Reject E2E implementation or execution that bypasses e2e_tests.md, e2e_test_tasks.md, and the x4-e2e-test-* chain."
  - name: no_legacy_test_routing
    rule: "Reject active routing to x4-test, x4-test-doc, x4-test-doc-viewer, x4-test-impl, or x4-test-run."
  - name: preserve_legacy_tests
    rule: "Reject deletion of old product tests when migration to tests/legacy/** can preserve them."
  - name: owned_blockers_only
    rule: "Task-local blocking validation must target owned paths. Record and route pre-existing out-of-scope failures to their owner without forcing the current task to repair them."
  - name: verify_no_skip
    when: ["/x4:verify"]
    rule: "Reject completion unless static checks, canonical tests/unit/**, and the active E2E workflow have passed."
  - name: archive_no_skip
    when: ["/x4:archive"]
    rule: "Reject archive unless the x4-verify output contract passes with no blockers."
