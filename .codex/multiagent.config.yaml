version: 1
name: x4-station-calculator-multiagent
description: Multi-agent orchestration aligned with current /x4 workflow and OpenSpec skills.

defaults:
  language: follow_user
  planning_write_scope: "openspec/**"
  implement_write_scope: "src/**,tests/unit/**,openspec/**"

routing:
  "/x4:discuss":
    pipeline: [workflow_orchestrator, discuss_analyst]
  "/x4:doc":
    pipeline: [workflow_orchestrator, doc_editor]
  "/x4:new":
    pipeline: [workflow_orchestrator, change_creator]
  "/x4:ff":
    pipeline: [workflow_orchestrator, fast_forward_creator]
  "/x4:apply":
    pipeline: [workflow_orchestrator, implementer, bug_tracker]
  "/x4:bug":
    pipeline: [workflow_orchestrator, bug_tracker]
  "/x4:verify":
    pipeline: [workflow_orchestrator, verifier, e2e_engineer]
  "/x4:e2e-test-doc":
    pipeline: [workflow_orchestrator, e2e_engineer]
  "/x4:e2e-test-doc-details":
    pipeline: [workflow_orchestrator, e2e_engineer]
  "/x4:e2e-test-doc-viewer":
    pipeline: [workflow_orchestrator, e2e_engineer]
  "/x4:e2e-test-impl":
    pipeline: [workflow_orchestrator, e2e_engineer]
  "/x4:e2e-test-run":
    pipeline: [workflow_orchestrator, e2e_engineer]
  "/x4:archive":
    pipeline: [workflow_orchestrator, archiver]
  default:
    pipeline: [workflow_orchestrator, implementer]

agents:
  workflow_orchestrator:
    role: "Phase router and guardrail enforcer"
    use_skills:
      - x4-user-workflow
    responsibilities:
      - "Parse command phase and choose agent pipeline."
      - "Enforce zero-code policy before /x4:apply."
      - "Require request.md as source of truth when entering /x4:new or /x4:ff from discuss."
      - "Ensure responses follow user language inferred from conversation context by default; do not default to English when user input is empty."
      - "If command includes language tag (e.g. #zh/#en), use tag language for that request."
      - "Ensure immutable spec headers remain English."

  discuss_analyst:
    role: "Discussion and requirement clarification"
    use_skills:
      - x4-discuss
    inputs:
      - "User problem statement"
      - "Existing specs/code for analysis"
    outputs:
      - "Implementation-ready plan"
      - "request.md draft checklist"
    constraints:
      - "No source-code edits."
      - "No docs edits unless explicitly requested."

  doc_editor:
    role: "Documentation/spec updater"
    use_skills:
      - x4-doc
      - openspec-sync-specs
    outputs:
      - "Updated spec/test docs under openspec/"
    constraints:
      - "Do not edit src/ or tests/."

  change_creator:
    role: "Step-by-step artifact creation"
    use_skills:
      - x4-new
    required_inputs:
      - "change_name"
      - "request.md (if from discuss)"
    required_outputs:
      - "proposal/spec/design/tasks"

  fast_forward_creator:
    role: "One-pass artifact creation"
    use_skills:
      - x4-ff
      - x4-doc
    required_outputs:
      - "request.md"
      - "proposal.md"
      - "design.md"
      - "tasks.md"

  implementer:
    role: "Code implementation"
    use_skills:
      - x4-apply
    required_inputs:
      - "openspec/changes/<change>/tasks.md"
      - "openspec/changes/<change>/design.md"
      - "openspec/changes/<change>/specs/**/spec.md"
    required_outputs:
      - "Code changes"
      - "tasks.md checkbox updates"
      - "Focused Unit evidence under tests/unit/** for behavior changes"

  bug_tracker:
    role: "Bug lifecycle owner during implementation"
    use_skills:
      - x4-bug
    responsibilities:
      - "When bug discovered: record in bugs.md, add reproduction test, verify fail, fix, verify pass."

  verifier:
    role: "Spec/task/code coherence verification"
    use_skills:
      - x4-verify
    required_outputs:
      - "Static verification report"
      - "Completion status across tasks/spec/design"

  e2e_engineer:
    role: "Active browser E2E workflow owner"
    use_skills:
      - x4-e2e-test-doc
      - x4-e2e-test-doc-details
      - x4-e2e-test-doc-viewer
      - x4-e2e-test-impl
      - x4-e2e-test-run
    constraints:
      - "Only modify active E2E artifacts and tests/e2e/**."
      - "Never invoke legacy test routes or make legacy failures blocking."

  archiver:
    role: "Archive completed change and promote specs"
    use_skills:
      - x4-archive
    required_inputs:
      - "Canonical Unit and selected active E2E evidence passed"
    required_outputs:
      - "Archived change"
      - "Promoted/merged main specs"

handoff_contracts:
  - from: discuss_analyst
    to: change_creator
    requires:
      - "request.md complete and approved"
  - from: change_creator
    to: implementer
    requires:
      - "tasks.md complete"
  - from: implementer
    to: verifier
    requires:
      - "tasks.md updated with progress"
  - from: verifier
    to: e2e_engineer
    requires:
      - "No blocking static mismatch; browser scope identified when applicable"
  - from: e2e_engineer
    to: archiver
    requires:
      - "Canonical active E2E evidence passed when browser behavior exists"

quality_gates:
  - name: planning_zero_code
    when: ["/x4:discuss", "/x4:doc", "/x4:new", "/x4:ff"]
    rule: "Reject any src/** or tests/** edits."
  - name: implementation_unit_ownership
    when: ["/x4:apply"]
    rule: "Reject behavior changes without focused tests/unit/** evidence; allow implementation and Unit edits only, reject tests/e2e/** edits."
  - name: active_e2e_separation
    when: ["/x4:e2e-test-doc", "/x4:e2e-test-doc-details", "/x4:e2e-test-doc-viewer", "/x4:e2e-test-impl", "/x4:e2e-test-run"]
    rule: "Allow active E2E workflow and tests/e2e/**; reject Unit ownership changes and any legacy route."
  - name: owned_path_blocker
    when: ["all"]
    rule: "Reject only failures in the current task's owned paths; allow and record failures in legacy or unrelated paths without blocking completion."
  - name: verify_canonical_evidence
    when: ["/x4:verify"]
    rule: "Reject missing or failing canonical Unit or selected active E2E evidence; allow legacy failures."
  - name: archive_canonical_evidence
    when: ["/x4:archive"]
    rule: "Reject archive without the /x4:verify canonical evidence gate; legacy artifacts never block archive."
