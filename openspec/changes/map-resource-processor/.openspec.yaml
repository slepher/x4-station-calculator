# map-resource-processor

## 概述

基于当前 `scripts/processor` 中 resource 处理代码的实现，整理出完整的 resource 处理文档，包括两个版本（8.0 regions / 9.0+ resourceareas）的逻辑分叉。

## 变更内容

### 新增文档

- `request.md` - 需求说明
- `design.md` - 设计说明（完整文档）

### 整理的核心内容

1. **版本分叉架构**
   - 8.0 版本使用 `regions` 模型（legacy_processor.py）
   - 9.0+ 版本使用 `resourceareas` 模型（modern_processor.py）
   - 版本判定在 `model_detector.py` 中根据主版本号决定

2. **Region 处理（8.0）**
   - regionyields.json：资源颜色和 yield 定义
   - regions.json：region 模板定义（boundary, falloff, resources）
   - resourceareas.json：sector 到 region 的引用关系
   - 核心算法：F_region = density × falloff_factor × noise_probability

3. **ResourceArea 处理（9.0+）**
   - regionyield_definitions.json：definition 定义数组
   - resourceareas.json：完整的资源区数据
   - regionyields.json：空数组占位（保持兼容）
   - 核心算法：sustainableYieldPerHour = yield / respawnDelay × 60

4. **Map 中 Resources 处理**
   - maps.json sector.resources 聚合（两个版本统一）
   - amount = Σ(yield × amount)
   - respawn = Σ(respawn × amount)

5. **完整的数据流图**
   - 8.0 版本数据流（XML → regions/resourceareas/maps）
   - 9.0+ 版本数据流（XML → definitions/resourceareas/maps）

